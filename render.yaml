services:
  - type: web
    name: media-mcp
    runtime: node
    plan: starter
    buildCommand: npm ci && npx tsc
    startCommand: node dist/src/index.js
    disk:
      name: media-mcp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MOCK_MODE
        value: "0"
      - key: DB_PATH
        value: /data/media-mcp.sqlite
      # Auto-generated on deploy — the operator never touches it. Encrypts
      # each tenant's stored credentials at rest (unique per instance).
      - key: ENCRYPTION_KEY
        generateValue: true
      # PUBLIC_BASE_URL is intentionally omitted: the app falls back to
      # Render's auto-injected RENDER_EXTERNAL_URL, so one-click deploys need
      # zero manual URL configuration.
      - key: WAKER_INTERVAL_MS
        value: "25000"
      # V3_BASE_URL / GHL_BASE_URL intentionally omitted: the code defaults are
      # authoritative. A pinned value here gets frozen into each blueprint
      # instance's env snapshot and silently overrides future code fixes
      # (that is exactly how the app.assistable.ai 404 regression shipped).
